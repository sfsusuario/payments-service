{% extends "base.html" %}
{% block title %}Iniciar sesión — payments-service{% endblock %}
{% block body %}
<main style="max-width: 380px; margin-top: 10vh;">
  <div class="card">
    <h2>payments-service</h2>
    <p class="hint">Panel de administración de pagos Wompi</p>
    {% if error %}<p class="flash-err">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</main>
{% endblock %}
